{{- /* One identity per tier; none calls the Kubernetes API, so no token is mounted. */}}
{{- range $tier := list "frontend" "backend" "db" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-tracker.fullname" $ }}-{{ $tier }}
  labels:
    {{- include "task-tracker.labels" (dict "ctx" $ "component" $tier) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
