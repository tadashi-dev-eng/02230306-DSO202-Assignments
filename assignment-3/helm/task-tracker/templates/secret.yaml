{{- /*
Created only when no existingSecret is given. Values passed here are stored in
Helm's release record (helm get values) - prefer database.auth.existingSecret.
*/}}
{{- if not .Values.database.auth.existingSecret }}
{{- $user := required "database.auth.username is required when database.auth.existingSecret is empty" .Values.database.auth.username }}
{{- $pass := required "database.auth.password is required when database.auth.existingSecret is empty" .Values.database.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.secretName" . }}
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ $user | b64enc | quote }}
  DB_PASSWORD: {{ $pass | b64enc | quote }}
  POSTGRES_USER: {{ $user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $pass | b64enc | quote }}
{{- end }}
