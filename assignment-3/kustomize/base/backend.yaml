apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels: {app: task-tracker, tier: backend}
spec:
  type: ClusterIP
  selector: {app: task-tracker, tier: backend}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels: {app: task-tracker, tier: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: task-tracker, tier: backend}
  template:
    metadata:
      labels: {app: task-tracker, tier: backend}
    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: sarojsanyasi/dso202-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config                # rewritten to app-config-<hash>
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_PASSWORD}
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
