# Namespace governance. Base values suit a 1-replica environment; the prod
# overlay raises them with a patch.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "8"
    services: "4"
    services.nodeports: "0"        # the Ingress is the only way in
    services.loadbalancers: "0"
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ns-limits
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 250m, memory: 256Mi}
      min: {cpu: 25m, memory: 32Mi}
      max: {cpu: "1", memory: 1Gi}
    - type: PersistentVolumeClaim
      min: {storage: 500Mi}
      max: {storage: 2Gi}
