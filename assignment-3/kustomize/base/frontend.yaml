apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels: {app: task-tracker, tier: frontend}
spec:
  type: ClusterIP
  selector: {app: task-tracker, tier: frontend}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels: {app: task-tracker, tier: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: task-tracker, tier: frontend}
  template:
    metadata:
      labels: {app: task-tracker, tier: frontend}
    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: sarojsanyasi/dso202-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef: {name: app-config, key: BACKEND_URL}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
