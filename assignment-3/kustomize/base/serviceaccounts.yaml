# One identity per tier; none of them talks to the Kubernetes API, so no token
# is mounted (Assignment 2, 2.3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
automountServiceAccountToken: false
