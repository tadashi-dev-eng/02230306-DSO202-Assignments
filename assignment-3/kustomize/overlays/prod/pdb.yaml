# Keep at least one frontend and one backend Pod during voluntary disruption
# (node drain, cluster upgrade). Meaningful only with 2 replicas - prod only.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: task-tracker, tier: backend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: task-tracker, tier: frontend}
