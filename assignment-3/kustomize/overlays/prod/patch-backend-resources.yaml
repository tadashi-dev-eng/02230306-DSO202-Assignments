# Strategic merge: "for Deployment backend-deployment, give the backend
# container more CPU/memory". The container is matched by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests: {cpu: 200m, memory: 192Mi}
            limits: {cpu: "1", memory: 384Mi}
