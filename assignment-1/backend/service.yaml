# ClusterIP: reachable only from inside the cluster, never from the host.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: dso202-assignment-01
  labels:
    tier: backend
    app: task-tracker
spec:
  type: ClusterIP
  selector:
    tier: backend
    app: task-tracker
  ports:
  - name: http
    port: 8080
    targetPort: 8080
