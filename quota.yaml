# Namespace governance. Justification for every value is in README, Task 6.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: dso202-assignment-01
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "8"
    services: "5"
    services.nodeports: "1"        # only the frontend may be exposed
    services.loadbalancers: "0"    # enforces "no LoadBalancer" constraint
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ns-limits
  namespace: dso202-assignment-01
spec:
  limits:
  - type: Container
    defaultRequest:          # applied when a container omits requests
      cpu: 100m
      memory: 128Mi
    default:                 # applied when a container omits limits
      cpu: 250m
      memory: 256Mi
    min:
      cpu: 25m
      memory: 32Mi
    max:
      cpu: "1"
      memory: 1Gi
  - type: PersistentVolumeClaim
    min:
      storage: 500Mi
    max:
      storage: 2Gi
