# 2.3 RBAC - one dedicated ServiceAccount per workload instead of the namespace's
# "default" SA. None of the three tiers talks to the Kubernetes API, so no Role is
# bound to them and no API token is mounted into their Pods (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: frontend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: backend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
  namespace: dso202-assignment-02
  labels: {app: task-tracker, tier: database}
automountServiceAccountToken: false
