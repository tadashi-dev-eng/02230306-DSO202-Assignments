# Namespace governance (carried over from Assignment 1, tightened for A2).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: dso202-assignment-02
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "8"
    services: "4"
    services.nodeports: "0"        # A2: Ingress is the only entry point - no NodePorts at all
    services.loadbalancers: "0"
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ns-limits
  namespace: dso202-assignment-02
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 250m
      memory: 256Mi
    min:
      cpu: 25m
      memory: 32Mi
    max:
      cpu: "1"
      memory: 1Gi
  - type: PersistentVolumeClaim
    min:
      storage: 500Mi
    max:
      storage: 2Gi
