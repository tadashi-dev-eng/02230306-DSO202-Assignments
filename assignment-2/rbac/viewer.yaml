# 2.3 RBAC - read-only ServiceAccount for a monitoring/inspection tool.
# Namespace-scoped Role + RoleBinding. Secrets are deliberately excluded.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-viewer
  namespace: dso202-assignment-02
  labels: {app: task-tracker}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
  namespace: dso202-assignment-02
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-viewer-binding
  namespace: dso202-assignment-02
subjects:
- kind: ServiceAccount
  name: app-viewer
  namespace: dso202-assignment-02
roleRef:
  kind: Role
  name: app-reader
  apiGroup: rbac.authorization.k8s.io
